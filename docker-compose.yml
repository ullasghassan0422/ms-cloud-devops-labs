services:
  backend:
    build: ./backend
    environment:
      PORT: 3000
      DATA_FILE: /app/data/notes.json
      CORS_ORIGIN: http://localhost:8081  # 👈 Update this to 8081
    volumes:
      - notes-data:/app/data
    ports:
      - "3000:3000"
    healthcheck:
      # 👇 Fixed the incomplete URL to hit the proper health endpoint
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: http://localhost:3000
    ports:
      - "8081:80"  # 👈 Change host port from 8080 to 8081
    depends_on:
      backend:
        condition: service_healthy

volumes:
  notes-data:
